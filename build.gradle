plugins {
    id 'java'
    // Версию плагина и NeoForge при необходимости возьмите из официального MDK под 1.21.1
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'ru.sailarmor'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.172'
    mods {
        hotstuff_cbc_armor { sourceSet sourceSets.main }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

dependencies {
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    compileOnly 'net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.82+mc1.21.1'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    compileOnly 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
}
